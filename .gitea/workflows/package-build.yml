name: Package Build - AppImage, Arch, Fedora, Debian

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'build-aux/AppImage/**'
      - 'build-aux/fedora-git.spec'
      - 'build-aux/PKGBUILD-git'
      - 'debian/**'
      - '.gitea/workflows/package-build.yml'

env:
  BUILD_BRANCH: ${{ github.ref_name }}
  PKGDEST: "/tmp/portprotonqt"
  PACKAGE: "portprotonqt"
  PR_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url }}
  PR_BRANCH: ${{ github.head_ref }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      appimage: ${{ steps.check.outputs.appimage }}
      fedora:   ${{ steps.check.outputs.fedora }}
      arch:     ${{ steps.check.outputs.arch }}
      debian:   ${{ steps.check.outputs.debian }}
    steps:
      - uses: https://git.linux-gaming.ru/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Ensure git is installed
        if: github.event_name == 'pull_request'
        run: |
          sudo apt update
          sudo apt install -y git

      - name: Check changed files
        if: github.event_name == 'pull_request'
        id: check
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt

          if grep -q "build-aux/AppImage/" changed_files.txt; then
            echo "appimage=true" >> $GITHUB_OUTPUT
          else
            echo "appimage=false" >> $GITHUB_OUTPUT
          fi

          if grep -q "build-aux/fedora-git.spec" changed_files.txt; then
            echo "fedora=true" >> $GITHUB_OUTPUT
          else
            echo "fedora=false" >> $GITHUB_OUTPUT
          fi

          if grep -q "build-aux/PKGBUILD-git" changed_files.txt; then
            echo "arch=true" >> $GITHUB_OUTPUT
          else
            echo "arch=false" >> $GITHUB_OUTPUT
          fi

          if grep -q "debian/" changed_files.txt; then
            echo "debian=true" >> $GITHUB_OUTPUT
          else
            echo "debian=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip change detection
        if: github.event_name == 'workflow_dispatch'
        run: true

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.appimage == 'true' || github.event_name == 'workflow_dispatch'
    container:
      image: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6
      options: --privileged --device /dev/fuse
    steps:
      - name: Prepare container
        run: |
          pacman-key --init
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --disable-download-timeout --needed git wget gnupg nodejs npm xorg-server-xvfb zsync patchelf

      - uses: https://git.linux-gaming.ru/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'

      - uses: https://git.linux-gaming.ru/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ env.BUILD_BRANCH }}

      - name: Install appimage dependencies
        run: |
          cd build-aux/AppImage
          chmod +x get-dependencies.sh portprotonqt-appimage.sh
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./get-dependencies.sh --local --branch "${{ env.PR_BRANCH }}" --repo "${{ env.PR_REPO_URL }}"
          else
            ./get-dependencies.sh --local --branch "${{ env.BUILD_BRANCH }}"
          fi

      - name: Build AppImage
        run: |
          cd build-aux/AppImage
          ./portprotonqt-appimage.sh

      - name: Upload AppImage
        uses: https://git.linux-gaming.ru/actions/gitea-upload-artifact@v4
        with:
          name: PortProtonQt-AppImage
          path: build-aux/AppImage/dist/*.AppImage*

  build-fedora:
    name: Build Fedora RPM
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.fedora == 'true' || github.event_name == 'workflow_dispatch'

    strategy:
      matrix:
        fedora_version: [43, 44, 45, rawhide]

    container:
      image: fedora:${{ matrix.fedora_version }}
      options: --privileged

    steps:
      - name: Install build dependencies
        run: |
          dnf upgrade -y --exclude=openh264,mozilla-openh264
          dnf install -y --disablerepo=fedora-cisco-openh264 \
                         git rpmdevtools meson ninja-build python3-devel \
                         systemd-rpm-macros vulkan-loader-devel redhat-rpm-config nodejs npm \
                         gcc gettext 'pkgconfig(sdl3)'

      - name: Setup rpmbuild environment
        run: |
          useradd rpmbuild -u 5002 -g users || true
          mkdir -p /home/rpmbuild/{BUILD,RPMS,SPECS,SRPMS,SOURCES}
          chown -R rpmbuild:users /home/rpmbuild
          echo '%_topdir /home/rpmbuild' > /home/rpmbuild/.rpmmacros

      - name: Checkout PR
        uses: https://git.linux-gaming.ru/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'

      - name: Checkout branch
        uses: https://git.linux-gaming.ru/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ env.BUILD_BRANCH }}

      - name: Copy fedora.spec
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sed "s|git clone https://git.linux-gaming.ru/Linux-Gaming/PortProtonQt.git|git clone -b ${{ env.PR_BRANCH }} ${{ env.PR_REPO_URL }}|" \
              build-aux/fedora-git.spec > /home/rpmbuild/SPECS/${{ env.PACKAGE }}.spec
          else
            sed "s|git clone https://git.linux-gaming.ru/Linux-Gaming/PortProtonQt.git|git clone -b ${{ env.BUILD_BRANCH }} https://git.linux-gaming.ru/Linux-Gaming/PortProtonQt.git|" \
              build-aux/fedora-git.spec > /home/rpmbuild/SPECS/${{ env.PACKAGE }}.spec
          fi
          chown -R rpmbuild:users /home/rpmbuild

      - name: Build RPM
        run: |
          su rpmbuild -c "rpmbuild -ba /home/rpmbuild/SPECS/${{ env.PACKAGE }}.spec"

      - name: Upload RPM package
        uses: https://git.linux-gaming.ru/actions/gitea-upload-artifact@v4
        with:
          name: PortProtonQt-RPM-Fedora-${{ matrix.fedora_version }}
          path: /home/rpmbuild/RPMS/**/*.rpm

  build-arch:
    name: Build Arch Package
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.arch == 'true' || github.event_name == 'workflow_dispatch'
    container:
      image: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6

    steps:
      - name: Prepare container
        run: |
          pacman -Syuu --noconfirm --disable-download-timeout --needed git wget gnupg nodejs npm
          sed -i 's/#MAKEFLAGS="-j2"/MAKEFLAGS="-j$(nproc) -l$(nproc)"/g' /etc/makepkg.conf
          sed -i 's/OPTIONS=(.*)/OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge lto)/g' /etc/makepkg.conf
          yes | pacman -Scc
          pacman-key --init
          pacman -S --noconfirm archlinux-keyring
          mkdir -p /__w/portproton-repo
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst'
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'
          cat << EOM >> /etc/pacman.conf

          [chaotic-aur]
          Include = /etc/pacman.d/chaotic-mirrorlist
          EOM
          pacman -Syy
          useradd -m user -G wheel && echo "user ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          echo "PACKAGER=\"Boris Yumankulov <boria138@altlinux.org>\"" >> /etc/makepkg.conf
          chown user -R /tmp
          chown user -R ..

      - name: Checkout PR
        uses: https://git.linux-gaming.ru/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'

      - name: Checkout branch
        uses: https://git.linux-gaming.ru/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ env.BUILD_BRANCH }}

      - name: Build
        run: |
          cd /__w/portproton-repo
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git clone -b ${{ env.PR_BRANCH }} ${{ env.PR_REPO_URL }} PortProtonQt
          else
            cp -r "$GITHUB_WORKSPACE" PortProtonQt
          fi
          cd /__w/portproton-repo/PortProtonQt/build-aux
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sed -i "s|source=(\"git+https://git.linux-gaming.ru/Linux-Gaming/PortProtonQt.git\")|source=(\"git+${{ env.PR_REPO_URL }}#branch=${{ env.PR_BRANCH }}\")|" PKGBUILD-git
          else
            sed -i "s|source=(\"git+https://git.linux-gaming.ru/Boria138/PortProtonQt.git\")|source=(\"git+https://git.linux-gaming.ru/Boria138/PortProtonQt.git#branch=${{ env.BUILD_BRANCH }}\")|" PKGBUILD-git
          fi
          chown user -R ..
          su user -c "yes '' | makepkg --noconfirm -s -p PKGBUILD-git"

      - name: Upload Arch package
        uses: https://git.linux-gaming.ru/actions/gitea-upload-artifact@v4
        with:
          name: PortProtonQt-Arch
          path: ${{ env.PKGDEST }}/*

  build-debian:
    name: Build Debian Package
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.debian == 'true' || github.event_name == 'workflow_dispatch'
    container:
      image: debian:trixie-20260824@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
      options: --privileged

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential debhelper dpkg-dev gettext git \
                             libsdl3-dev libvulkan-dev meson ninja-build nodejs npm \
                             pkgconf python3

      - name: Checkout PR
        uses: https://git.linux-gaming.ru/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'

      - name: Checkout branch
        uses: https://git.linux-gaming.ru/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ env.BUILD_BRANCH }}

      - name: Build Debian package
        run: |
          DEB_BUILD_OPTIONS=noautodbgsym dpkg-buildpackage -us -uc -b
          mkdir -p dist/deb
          mv ../*.deb dist/deb/

      - name: Upload Debian package
        uses: https://git.linux-gaming.ru/actions/gitea-upload-artifact@v4
        with:
          name: PortProtonQt-DEB-Debian-13
          path: dist/deb/*
