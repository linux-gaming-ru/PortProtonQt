name: Build AppImage, Arch, Fedora and Debian Packages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "hotfix"
        type: choice
        options:
          - hotfix
          - release
  push:
    tags:
      - 'v[0-9]*.[0-9]*'

env:
  # Common version, will be used for tagging the release
  VERSION: 1.4.1
  PKGDEST: "/tmp/portprotonqt"
  PACKAGE: "portprotonqt"
  GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
  RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'release' }}

jobs:
  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04
    container:
      image: archlinux:base-devel
      options: --privileged --device /dev/fuse
    steps:
      - name: Prepare container
        uses: https://git.linux-gaming.ru/actions/anylinux-setup-action@7278cbb7c3692fce7241d427614ef7984192f138 # v3

      - name: Install CI dependencies
        run: pacman -S --noconfirm --needed nodejs npm

      - uses: https://git.linux-gaming.ru/actions/checkout@v4

      - name: Install appimage dependencies
        run: |
          cd build-aux/AppImage
          chmod +x get-dependencies.sh portprotonqt-appimage.sh
          if [ "${{ env.RUN_MODE }}" = "hotfix" ]; then
            ./get-dependencies.sh --branch "${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            ./get-dependencies.sh --tag "${{ github.ref_name }}"
          else
            ./get-dependencies.sh
          fi

      - name: Build AppImage
        run: |
          cd build-aux/AppImage
          ./portprotonqt-appimage.sh

      - name: Upload AppImage
        uses: https://git.linux-gaming.ru/actions/gitea-upload-artifact@v4
        with:
          name: PortProtonQt-AppImage
          path: build-aux/AppImage/dist/*.AppImage*

  build-arch:
    name: Build Arch Package
    runs-on: ubuntu-22.04
    container:
      image: archlinux:base-devel

    steps:
      - name: Prepare container
        run: |
          pacman -Syuu --noconfirm --disable-download-timeout --needed git wget gnupg nodejs npm
          sed -i 's/#MAKEFLAGS="-j2"/MAKEFLAGS="-j$(nproc) -l$(nproc)"/g' /etc/makepkg.conf
          sed -i 's/OPTIONS=(.*)/OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge lto)/g' /etc/makepkg.conf
          yes | pacman -Scc
          pacman-key --init
          pacman -S --noconfirm archlinux-keyring
          mkdir -p /__w/portproton-repo
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst'
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'
          cat << EOM >> /etc/pacman.conf

          [chaotic-aur]
          Include = /etc/pacman.d/chaotic-mirrorlist
          EOM
          pacman -Syy
          useradd -m user -G wheel && echo "user ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          echo "PACKAGER=\"Boris Yumankulov <boria138@altlinux.org>\"" >> /etc/makepkg.conf
          chown user -R /tmp
          chown user -R ..

      - name: Checkout
        uses: https://git.linux-gaming.ru/actions/checkout@v4

      - name: Build
        run: |
          cd /__w/portproton-repo
          cp -r "$GITHUB_WORKSPACE" PortProtonQt
          cd /__w/portproton-repo/PortProtonQt/build-aux
          if [ "${{ env.RUN_MODE }}" = "hotfix" ]; then
            sed -i "s|^source=.*|source=(\"git+https://git.linux-gaming.ru/Linux-Gaming/PortProtonQt.git#branch=${{ github.ref_name }}\")|" PKGBUILD
          fi
          chown user -R ..
          su user -c "yes '' | makepkg --noconfirm -s"

      - name: Upload Arch package
        uses: https://git.linux-gaming.ru/actions/gitea-upload-artifact@v4
        with:
          name: PortProtonQt-Arch
          path: ${{ env.PKGDEST }}/*

  build-fedora:
    name: Build Fedora RPM
    runs-on: ubuntu-latest

    strategy:
      matrix:
        fedora_version: [43, 44, 45, rawhide]

    container:
      image: fedora:${{ matrix.fedora_version }}
      options: --privileged

    steps:
      - name: Install build dependencies
        run: |
          dnf upgrade -y --exclude=openh264,mozilla-openh264
          dnf install -y --disablerepo=fedora-cisco-openh264 \
                         git rpmdevtools meson ninja-build python3-devel \
                         systemd-rpm-macros vulkan-loader-devel redhat-rpm-config nodejs npm \
                         gcc gettext 'pkgconfig(sdl3)'

      - name: Setup rpmbuild environment
        run: |
          useradd rpmbuild -u 5002 -g users || true
          mkdir -p /home/rpmbuild/{BUILD,RPMS,SPECS,SRPMS,SOURCES}
          chown -R rpmbuild:users /home/rpmbuild
          echo '%_topdir /home/rpmbuild' > /home/rpmbuild/.rpmmacros

      - name: Checkout repo
        uses: https://git.linux-gaming.ru/actions/checkout@v4

      - name: Copy fedora.spec
        run: |
          cp build-aux/fedora.spec /home/rpmbuild/SPECS/${{ env.PACKAGE }}.spec
          if [ "${{ env.RUN_MODE }}" = "hotfix" ]; then
            sed -i "s|git checkout v%{pypi_version}|git checkout ${{ github.ref_name }}|" /home/rpmbuild/SPECS/${{ env.PACKAGE }}.spec
          fi
          chown -R rpmbuild:users /home/rpmbuild

      - name: Build RPM
        run: |
          su rpmbuild -c "rpmbuild -ba /home/rpmbuild/SPECS/${{ env.PACKAGE }}.spec"

      - name: Upload RPM package
        uses: https://git.linux-gaming.ru/actions/gitea-upload-artifact@v4
        with:
          name: PortProtonQt-RPM-Fedora-${{ matrix.fedora_version }}
          path: /home/rpmbuild/RPMS/**/*.rpm

  build-debian:
    name: Build Debian Package
    runs-on: ubuntu-latest
    container:
      image: debian:13
      options: --privileged

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential debhelper dpkg-dev gettext git \
                             libsdl3-dev libvulkan-dev meson ninja-build nodejs npm \
                             pkgconf python3

      - name: Checkout
        uses: https://git.linux-gaming.ru/actions/checkout@v4

      - name: Build Debian package
        run: |
          DEB_BUILD_OPTIONS=noautodbgsym dpkg-buildpackage -us -uc -b
          mkdir -p dist/deb
          mv ../*.deb dist/deb/

      - name: Upload Debian package
        uses: https://git.linux-gaming.ru/actions/gitea-upload-artifact@v4
        with:
          name: PortProtonQt-DEB-Debian-13
          path: dist/deb/*

  release:
    name: Create and Publish Release
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: https://git.linux-gaming.ru/actions/checkout@v4

      - name: Install required dependencies
        run: |
            sudo apt update
            sudo apt install -y original-awk unzip

      - name: Download all artifacts
        uses: https://git.linux-gaming.ru/actions/download-artifact@v3
        continue-on-error: true
        with:
          path: release/

      - name: Extract downloaded artifacts
        run: |
          mkdir -p extracted
          find release/ -name '*.zip' -exec unzip -o {} -d extracted/ \;
          find extracted/ -type f -exec mv {} release/ \;
          find release/ -name '*.zip' -delete
          rm -rf extracted/

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ env.VERSION }}"
          awk "/^## \\[$VERSION\\]/ {flag=1; next} /^## \\[/ || /^---/ {flag=0} flag" CHANGELOG.md > changelog.txt

      - name: Release
        uses: https://git.linux-gaming.ru/actions/gitea-release-action@v1
        env:
            NODE_OPTIONS: '--experimental-fetch' # if nodejs < 18
        with:
          body_path: changelog.txt
          token: ${{ env.GITEA_TOKEN }}
          tag_name: v${{ env.VERSION }}
          prerelease: false
          files: release/**/*
          sha256sum: false
