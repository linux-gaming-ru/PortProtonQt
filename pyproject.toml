[project]
name = "portprotonqt"
version = "1.4.1"
description = "A project to rewrite PortProton (PortWINE) using PySide"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [
  { name = "Boria138" },
  { name = "BlackSnaker" },
  { name = "Mikhail Tergoev(Castro-Fidel)" }
]
keywords = ["portproton", "wine", "game", "steam"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux"
]
dependencies = [
    "babel>=2.18.0",
    "evdev>=1.9.3",
    "libarchive-c>=5.3",
    "orjson>=3.12.0",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pyside6>=6.11.2",
    "rapidfuzz>=3.14.6",
    "qrcode>=8.2",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
    "vdf>=3.4",
    "websocket-client>=1.9.2",
    "dbus-fast>=5.0.22",
    "pefile>=2024.8.26",
]

[project.scripts]
portprotonqt = "portprotonqt.app:main"

[tool.setuptools.packages.find]
include = ["portprotonqt*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "UP"]
ignore = ["B008", "C901", "W191", "E501"]

[tool.ruff.lint.isort]
known-third-party = ["portprotonqt"]

[tool.ruff]
exclude = [".eggs", ".git", "build", "dist", "portprotonqt.egg-info", ".venv", "venv", "dev-scripts", "portprotonqt/themes", ".vscode"]
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "Linux"
ignore = [".eggs", ".git", "build", "dist", "portprotonqt.egg-info", ".venv", "venv", "dev-scripts", "portprotonqt/themes", ".vscode"]
